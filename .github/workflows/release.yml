name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v (for example, 1.2.3 or 1.2.3-beta.1)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must be run from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3 or 1.2.3-beta.1 (without a leading v)."
            exit 1
          fi

          git fetch --no-tags origin "refs/heads/$GITHUB_REF_NAME"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::$GITHUB_REF_NAME changed since this release started. Run it again."
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          if ! git check-ref-format "refs/tags/$tag"; then
            echo "::error::$tag is not a valid Git tag."
            exit 1
          fi

          if git ls-remote --exit-code --refs --tags origin "refs/tags/$tag" >/dev/null 2>&1 || \
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag or release $tag already exists."
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Commit version bump when needed
        id: target
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          current_version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          if [[ -z "$current_version" ]]; then
            echo "::error::mod_version was not found in gradle.properties."
            exit 1
          fi

          if [[ "$current_version" != "$RELEASE_VERSION" ]]; then
            sed -i "s/^mod_version=.*/mod_version=$RELEASE_VERSION/" gradle.properties
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradle.properties
            git commit -m "chore: release $RELEASE_TAG"

            # GITHUB_TOKEN pushes do not trigger push workflows; build.yml is called below.
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          else
            echo "gradle.properties is already set to $RELEASE_VERSION; reusing the current commit."
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release-notes:
    name: Generate release notes
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write

    steps:
      - name: Check out release commit without write credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated Copilot workspace
        id: context
        env:
          OUTPUT_DIR: .release-ai/.release-context
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          bash .github/scripts/prepare-release-context.sh
          cp .github/copilot/prompts/release-notes.md .release-ai/prompt.md
          find .release-ai -type f -exec sha256sum {} + | sort > "$RUNNER_TEMP/copilot-inputs.before"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot@1

      - name: Generate release notes with Copilot
        working-directory: .release-ai
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ -e release-notes.md ]]; then
            echo "::error::release-notes.md unexpectedly exists before Copilot runs."
            exit 1
          fi

          copilot \
            --prompt "$(cat prompt.md)" \
            --allow-tool=read \
            --allow-tool='write(release-notes.md)' \
            --no-ask-user

          if [[ ! -s release-notes.md ]]; then
            echo "::error::Copilot did not generate release notes."
            exit 1
          fi

      - name: Verify Copilot changed only the release notes
        run: |
          find .release-ai -type f ! -path '.release-ai/release-notes.md' -exec sha256sum {} + \
            | sort > "$RUNNER_TEMP/copilot-inputs.after"
          diff -u "$RUNNER_TEMP/copilot-inputs.before" "$RUNNER_TEMP/copilot-inputs.after"
          git diff --exit-code -- .

          unexpected_files="$(git ls-files --others --exclude-standard | grep -v '^\.release-ai/' || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "::error::Copilot created unexpected files outside its isolated workspace."
            printf '%s\n' "$unexpected_files"
            exit 1
          fi

      - name: Finalize release notes
        env:
          PREVIOUS_TAG: ${{ steps.context.outputs.previous_tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          notes=.release-ai/release-notes.md

          # The GitHub release already has a title, so discard any leading H1.
          sed -i '/[^[:space:]]/,$!d' "$notes"
          sed -i '1{/^[[:space:]]*#[[:space:]]/d;}' "$notes"
          sed -i '/[^[:space:]]/,$!d' "$notes"

          if [[ ! -s "$notes" ]]; then
            echo "::error::Release notes were empty after validation."
            exit 1
          fi

          echo >> "$notes"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            echo "**Full changelog:** [$PREVIOUS_TAG...$RELEASE_TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$RELEASE_TAG)" >> "$notes"
          else
            echo "**Commit history:** [$RELEASE_TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$RELEASE_TAG)" >> "$notes"
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ needs.prepare.outputs.tag }}
          path: .release-ai/release-notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build release artifacts
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Publish ${{ needs.prepare.outputs.tag }}
    needs:
      - prepare
      - release-notes
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes-${{ needs.prepare.outputs.tag }}
          path: release-inputs

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_NAME: ${{ needs.build.outputs.mod_name }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch --no-tags origin "refs/heads/$GITHUB_REF_NAME"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$TARGET_SHA" ]]; then
            echo "::error::$GITHUB_REF_NAME changed while the release was being prepared. Run it again."
            exit 1
          fi

          if git ls-remote --exit-code --refs --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1 || \
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag or release $RELEASE_TAG already exists."
            exit 1
          fi

          shopt -s nullglob
          jars=(release-assets/*.jar)
          if (( ${#jars[@]} == 0 )) || [[ ! -s release-inputs/release-notes.md ]]; then
            echo "::error::Release artifacts or notes are missing."
            exit 1
          fi

          args=(
            release create "$RELEASE_TAG"
            "${jars[@]}"
            --repo "$GITHUB_REPOSITORY"
            --target "$TARGET_SHA"
            --title "$MOD_NAME $RELEASE_VERSION"
            --notes-file release-inputs/release-notes.md
          )
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi

          release_url="$(gh "${args[@]}")"

          {
            echo "## Release published"
            echo
            echo "[$RELEASE_TAG]($release_url) was built, tagged, and published with Copilot-generated release notes."
          } >> "$GITHUB_STEP_SUMMARY"
